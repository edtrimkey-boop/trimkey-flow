<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acme Sneakers | Checkout</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f9fafb; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .product-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; max-width: 400px; }
        .product-card img { width: 100%; border-radius: 12px; margin-bottom: 20px; }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #111827; }
        p { color: #6b7280; margin-bottom: 30px; line-height: 1.5; }
        .price { font-size: 32px; font-weight: 800; color: #111827; margin-bottom: 20px; }
        button { background-color: #000; color: white; border: none; padding: 16px 32px; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; width: 100%; transition: all 0.2s; }
        button:hover { background-color: #374151; transform: translateY(-2px); }
        button:disabled { background-color: #9ca3af; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>

    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80" alt="Red Nike Sneaker">
        <h1>Nike Air Max 2026</h1>
        <p>Experience the next generation of comfort and style.</p>
        <div class="price">₹1,500</div>
        
        <button id="buy-btn" onclick="startCheckout()">Buy Now with Trim Key</button>
    </div>

    <script>
        // NOTE TO MERCHANT: In production, this API call should happen on your BACKEND
        // so your Secret API Key is never exposed in the browser!
        
        const TRIM_KEY_API_KEY = "tk_live_1c1c3ecd4ddfbcd157ba68049cf99f7d4016457e738380541cc9f904476dd133"; 

        async function startCheckout() {
            const btn = document.getElementById('buy-btn');
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                const response = await fetch('http://localhost:3000/api/v1', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${TRIM_KEY_API_KEY}`
                    },
                    body: JSON.stringify({
                        action: "payment.create",
                        data: {
                            merchant_id: "33333333-3333-3333-3333-333333333333", // The test merchant we created
                            amount: 150000, // Amount in paise (1500.00 INR)
                            currency: "USD",
                            purpose: "Nike Air Max 2026",
                            customer: {
                                name: "Demo Customer",
                                email: "demo@example.com",
                                phone: "9999999999"
                            }
                        }
                    })
                });

                const result = await response.json();

                if (result.success && result.data.checkout_url) {
                    // Success! Redirect the customer to the Trim Key Smart Checkout URL
                    window.location.href = result.data.checkout_url;
                } else {
                    alert("Payment Failed: " + (result.error?.message || "Unknown error"));
                    btn.innerText = "Buy Now with Trim Key";
                    btn.disabled = false;
                }
            } catch (error) {
                alert("Network error. Is your Next.js server running?");
                btn.innerText = "Buy Now with Trim Key";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
